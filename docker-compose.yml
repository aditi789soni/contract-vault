version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: contract_vault_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_vault
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/migrations/20261019000000_init_rls/migration.sql:/docker-entrypoint-initdb.d/01-init-rls.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d contract_vault']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: contract_vault_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    container_name: contract_vault_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/contracts;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contract_vault_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://app_user:app_password@postgres:5432/contract_vault?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@postgres:5432/contract_vault?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-super-secret-enterprise-access-key-change-in-prod}
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-super-secret-enterprise-refresh-key-change-in-prod}
      JWT_REFRESH_EXPIRATION: 7d
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_BUCKET_NAME: contracts
      S3_FORCE_PATH_STYLE: 'true'
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  minio_data:
